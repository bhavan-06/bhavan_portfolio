<svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spideyMaskGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff2e43" />
      <stop offset="70%" stop-color="#c8081f" />
      <stop offset="100%" stop-color="#7a000e" />
    </radialGradient>
    <linearGradient id="spideyLensShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#edf2f7" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Mask Base -->
  <path d="M 50 4 C 76 4, 96 22, 96 50 C 96 78, 76 102, 50 116 C 24 102, 4 78, 4 50 C 4 22, 24 4, 50 4 Z" 
        fill="url(#spideyMaskGrad)" stroke="#160003" stroke-width="2.5" />

  <!-- Web Radial Spokes radiating from nose bridge (50, 52) -->
  <g stroke="#140003" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <path d="M 50 52 L 50 4" />
    <path d="M 50 52 L 26 8" />
    <path d="M 50 52 L 74 8" />
    <path d="M 50 52 L 6 34" />
    <path d="M 50 52 L 94 34" />
    <path d="M 50 52 L 5 58" />
    <path d="M 50 52 L 95 58" />
    <path d="M 50 52 L 14 86" />
    <path d="M 50 52 L 86 86" />
    <path d="M 50 52 L 32 108" />
    <path d="M 50 52 L 68 108" />
    <path d="M 50 52 L 50 116" />
  </g>

  <!-- Concentric Web Curves -->
  <g stroke="#140003" stroke-width="1.6" fill="none" opacity="0.8">
    <path d="M 38 20 Q 50 25 62 20" />
    <path d="M 26 10 Q 50 16 74 10" />
    <path d="M 27 34 Q 50 42 73 34" />
    <path d="M 12 24 Q 20 28 27 34" />
    <path d="M 88 24 Q 80 28 73 34" />
    <path d="M 6 64 Q 22 72 35 72" />
    <path d="M 94 64 Q 78 72 65 72" />
    <path d="M 16 86 Q 50 98 84 86" />
    <path d="M 28 102 Q 50 109 72 102" />
  </g>

  <!-- EYES -->
  <!-- Left Eye Frame -->
  <path d="M 44 51 L 14 35 C 9 44, 8 57, 16 66 C 24 74, 35 72, 44 51 Z" 
        fill="#0a0a0d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left Eye Lens -->
  <path d="M 41 51 L 18 38 C 14 46, 13 56, 20 63 C 26 69, 34 67, 41 51 Z" 
        fill="url(#spideyLensShine)"/>
  <!-- Left Eye Rim Glint -->
  <path d="M 20 40 L 34 47 C 32 52, 26 55, 21 52 C 18 48, 18 44, 20 40 Z" 
        fill="rgba(6, 182, 212, 0.22)"/>

  <!-- Right Eye Frame -->
  <path d="M 56 51 L 86 35 C 91 44, 92 57, 84 66 C 76 74, 65 72, 56 51 Z" 
        fill="#0a0a0d" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right Eye Lens -->
  <path d="M 59 51 L 82 38 C 86 46, 87 56, 80 63 C 74 69, 66 67, 59 51 Z" 
        fill="url(#spideyLensShine)"/>
  <!-- Right Eye Rim Glint -->
  <path d="M 80 40 L 66 47 C 68 52, 74 55, 79 52 C 82 48, 82 44, 80 40 Z" 
        fill="rgba(6, 182, 212, 0.22)"/>
