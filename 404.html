<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Page not found - Bhavan Kumar Portfolio">

    <title>
        404 | Page Not Found
    </title>


    <!-- FONTS -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>


    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- ICONS -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- PORTFOLIO CSS -->

    <link rel="stylesheet"
        href="css/reset.css">

    <link rel="stylesheet"
        href="css/variables.css">

    <link rel="stylesheet"
        href="css/style.css">


    <style>

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

        }


        .error-page {

            position: relative;

            width: min(1000px, 90%);

            text-align: center;

            z-index: 1;

        }


        .error-code {

            font-family:
                var(--font-heading);

            font-size:
                clamp(
                    120px,
                    25vw,
                    300px
                );

            font-weight: 700;

            line-height: 0.8;

            color: transparent;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary),
                    var(--accent)
                );

            background-clip: text;

            -webkit-background-clip:
                text;

            animation:
                errorFloat
                5s
                ease-in-out
                infinite;

        }


        .error-title {

            font-family:
                var(--font-heading);

            font-size:
                clamp(
                    28px,
                    5vw,
                    55px
                );

            margin-top:
                30px;

        }


        .error-text {

            max-width:
                600px;

            margin:
                20px auto 35px;

            color:
                var(--text-secondary);

            font-size:
                18px;

            line-height:
                1.7;

        }


        .error-actions {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

        }


        .error-orb {

            position: fixed;

            width: 400px;

            height: 400px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.25;

            pointer-events: none;

        }


        .orb-one {

            background:
                var(--primary);

            top:
                -150px;

            left:
                -150px;

        }


        .orb-two {

            background:
                var(--secondary);

            bottom:
                -150px;

            right:
                -150px;

        }


        .error-home {

            padding:
                16px 28px;

            border-radius:
                14px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            color:
                white;

            font-weight:
                700;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

        }


        .error-home:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 15px 40px
                rgba(
                    139,
                    92,
                    246,
                    0.4
                );

        }


        .error-back {

            padding:
                16px 28px;

            border-radius:
                14px;

            border:
                1px solid
                var(--border);

            color:
                var(--text);

            background:
                var(--card);

            transition:
                transform 0.3s ease;

        }


        .error-back:hover {

            transform:
                translateY(-5px);

        }


        .error-brand {

            position: absolute;

            top:
                30px;

            left:
                50%;

            transform:
                translateX(-50%);

            font-family:
                var(--font-heading);

            font-size:
                22px;

            font-weight:
                700;

        }


        .error-brand span {

            color:
                var(--primary);

        }


        @keyframes errorFloat {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-15px);

            }

        }


        @media
        (max-width: 600px) {

            .error-actions {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .error-home,
            .error-back {

                width:
                    100%;

            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div
        class="error-orb orb-one">
    </div>


    <div
        class="error-orb orb-two">
    </div>


    <!-- BRAND -->

    <a
        href="index.html"
        class="error-brand">

        BHAVAN<span>.</span>

    </a>


    <!-- ERROR CONTENT -->

    <main
        class="error-page">


        <div
            class="error-code">

            404

        </div>


        <h1
            class="error-title">

            Oops! You seem to be lost.

        </h1>


        <p
            class="error-text">

            The page you are looking for
            might have been moved, deleted,
            or perhaps it never existed.

            Let's get you back to the portfolio.

        </p>


        <div
            class="error-actions">


            <a
                href="index.html"
                class="error-home">

                <i
                    class="fa-solid fa-house">

                </i>

                Back to Home

            </a>


            <button
                class="error-back"
                onclick="goBack()">

                <i
                    class="fa-solid fa-arrow-left">

                </i>

                Go Back

            </button>


        </div>


    </main>


    <script>

        function goBack() {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "index.html";

            }

        }

    </script>


</body>

</html>
